<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend Pickup Add-On Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   STRUCTURE LAYER. Geometry, sizing and behavior only.
   Every color, fill, border, radius and typeface lives in
   tv-board/theme.css, which build_board.py inlines below.
   Marketing never edits this block.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 16px 22px;background:#050D18}

/* ---------- preview chrome, NOT part of the board ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  width:100%;max-width:1400px;font:600 12px/1.4 system-ui,sans-serif;color:#8FA6C2}
.ctl .grp{display:flex;gap:6px;align-items:center;background:#0B1A2E;border:1px solid #16304F;border-radius:999px;padding:5px 8px}
.ctl b{color:#6B84A3;font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:10px;padding:0 4px}
.ctl button{font:700 12px system-ui,sans-serif;color:#B9CEE6;background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 11px;cursor:pointer}
.ctl button:hover{background:#16304F}
.ctl button[aria-pressed="true"]{background:#F89521;color:#1A0C00}
.note{max-width:1400px;width:100%;font:500 12px/1.6 system-ui,sans-serif;color:#7A93B2;text-align:center}
body.kiosk .ctl,body.kiosk .note{display:none}
body.kiosk{padding:0;gap:0;background:#000}

/* ---------------------- board frame -------------------------- */
.stage{position:relative;width:100%;max-width:min(100%, calc((100vh - 120px) * 16 / 9));
  aspect-ratio:16/9;container-type:size;overflow:hidden}
body.kiosk .stage{max-width:100vw;height:100vh;max-height:100vh}

/* ZONE 1, identity band */
.hdr{position:absolute;top:0;left:0;right:0;height:11cqh;display:flex;
  align-items:center;justify-content:space-between;padding:0 4cqw}
.brand{display:flex;align-items:center;gap:1.4cqw;min-width:0}
.brand .logo{height:6.2cqh;width:auto;display:block;flex:none}
.brand .loc{font-size:2.1cqh;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  padding-left:1.3cqw;border-left-style:solid;border-left-width:.25cqh;white-space:nowrap}
.stamp{display:flex;align-items:center;gap:.9cqw;padding:1cqh 1.8cqw;border-radius:999px;
  border-style:solid;border-width:.2cqh;flex:none}
.stamp .dot{width:1.2cqh;height:1.2cqh;border-radius:50%;flex:none}
.stamp .tx{font-size:1.9cqh;font-weight:800;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.stage[data-state="live"] .stamp .dot{animation:pulse 2.4s ease-in-out infinite}

/* ZONE 2, the rule */
.rule{position:absolute;top:11cqh;left:0;right:0;height:12cqh;
  display:flex;align-items:center;gap:2.4cqw;padding:0 4cqw}
.rule .big{font-size:5.8cqh;font-weight:900;line-height:1;letter-spacing:-.015em;white-space:nowrap}
.rule .sub{font-size:2.35cqh;font-weight:600;line-height:1.25;padding-left:2.2cqw}

/* ZONE 3, body split */
.body{position:absolute;top:23cqh;left:0;right:0;bottom:10.5cqh;
  display:grid;grid-template-columns:61% 39%;gap:2.2cqw;padding:2.2cqh 4cqw 1.6cqh}
.zlab{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:1.1cqh;margin-bottom:1.3cqh}
.zlab .t{font-size:2.5cqh;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.zlab .c{font-size:1.85cqh;font-weight:700;letter-spacing:.11em;text-transform:uppercase}

/* 3a, the add-on menu. Fixed, never rotates. */
.menu{display:flex;flex-direction:column;min-height:0}
/* The row is ONE component that scales continuously so the whole
   list always fits, whether a store has three add-ons or eight.
   --s is set by JS. Design the row, never its height. */
.rows{--s:1;display:flex;flex-direction:column;justify-content:center;
  gap:calc(.85cqh * var(--s));flex:1;min-height:0;overflow:hidden}
.row{flex:0 0 auto;display:grid;grid-template-columns:1fr auto auto;align-items:center;
  gap:1.4cqw;padding:calc(1.15cqh * var(--s)) calc(1.8cqw * var(--s))}
.row .nm{font-weight:700;line-height:1.08;font-size:calc(3.9cqh * var(--s));
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .meta{display:flex;align-items:center;flex-wrap:wrap;gap:0 calc(.85cqw * var(--s));
  margin-top:calc(.5cqh * var(--s));font-weight:600;font-size:calc(2.15cqh * var(--s))}
.row .meta .was,.row .meta .req{font-weight:800}
.row .meta .d{opacity:.4}
.pill{display:inline-block;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:.28cqh .75cqw;line-height:1.15;font-size:calc(1.72cqh * var(--s))}
.row .now{text-align:right;line-height:1;min-width:calc(13cqw * var(--s))}
.row .now .lab{display:block;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  font-size:calc(1.72cqh * var(--s));margin-bottom:calc(.35cqh * var(--s))}
.row .now .amt{font-weight:900;line-height:.92;white-space:nowrap;font-size:calc(6cqh * var(--s))}
.row .now .amt s{font-weight:800;text-decoration:none;vertical-align:.45em;font-size:calc(2.8cqh * var(--s))}
.bdg{display:inline-block;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:calc(.55cqh * var(--s)) calc(1cqw * var(--s));white-space:nowrap;
  font-size:calc(1.85cqh * var(--s));line-height:1.1}

/* 3b, the rotating card zone */
.fresh{position:relative;display:flex;flex-direction:column;min-height:0}
.fcards{display:grid;grid-template-rows:repeat(3,1fr);gap:1.5cqh;flex:1;min-height:0}
.fcard{--cs:1;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:1.6cqh 1.8cqw;min-height:0;overflow:hidden;
  transition:opacity .45s ease, transform .45s ease}
.fcard[data-flag=""]::before{display:none}
.fcard .nm{padding-right:0}
.fcard[data-flag]:not([data-flag=""]) .nm{padding-right:5.5cqw}
.fcard::before{content:attr(data-flag);position:absolute;top:1.2cqh;right:1.4cqw;
  font-size:1.45cqh;font-weight:900;letter-spacing:.16em;text-transform:uppercase;padding:.35cqh .9cqw}
.fcard .nm{font-size:calc(3.1cqh * var(--cs));font-weight:700;line-height:1.1;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.fcard .meta{display:flex;align-items:center;flex-wrap:wrap;gap:.3cqh .9cqw;
  margin-top:calc(.9cqh * var(--cs));font-size:calc(1.95cqh * var(--cs));font-weight:600}
.fcard .pill{font-size:calc(1.5cqh * var(--cs))}
.fcard .deal{margin-top:calc(1cqh * var(--cs));font-size:calc(3.6cqh * var(--cs));font-weight:900;line-height:1}
.fcard .deal s{font-size:calc(2.2cqh * var(--cs));font-weight:800;text-decoration:none;letter-spacing:.06em;
  text-transform:uppercase;margin-right:.6cqw;vertical-align:.35em}
.fcards.fade .fcard{opacity:0;transform:translateY(1.1cqh)}
.dots{display:flex;gap:.6cqw;align-items:center}
.dots i{width:1.1cqh;height:1.1cqh;border-radius:50%;display:block}
.empty{display:flex;align-items:center;justify-content:center;height:100%;grid-row:1 / span 3;
  font-size:2.2cqh;font-weight:600;text-align:center;padding:0 2cqw}
.hair{position:absolute;left:0;bottom:-1.6cqh;height:.4cqh;width:0;opacity:.8}
@keyframes fill{from{width:0}to{width:100%}}

/* ZONE 4, ticker */
.tick{position:absolute;left:0;right:0;bottom:0;height:10.5cqh;
  display:grid;grid-template-columns:auto 1fr auto;align-items:stretch}
.tick .cap{display:flex;align-items:center;padding:0 1.6cqw 0 4cqw;
  font-size:2.1cqh;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.tick .win{position:relative;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 2.5cqw);
  mask-image:linear-gradient(90deg,transparent 0,#000 2.5cqw)}
.track{display:flex;align-items:center;flex:none;will-change:transform}
.track .seg{display:flex;align-items:center;gap:1.2cqw;padding:0 1.6cqw;
  font-size:2.45cqh;font-weight:700;white-space:nowrap}
.track .seg u{font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:1.85cqh}
.track .sep{width:.75cqh;height:.75cqh;flex:none}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(var(--shift))}}
.tick .fix{display:flex;align-items:center;max-width:24cqw;padding:0 4cqw 0 1.8cqw;
  font-size:1.6cqh;font-weight:600;line-height:1.3}

/* still frame: a frozen image cannot scroll or time a rotation */
body.still .hair{display:none}
body.still .tick .win{-webkit-mask-image:none;mask-image:none}
body.still .track{justify-content:space-around;width:100%}
@media (max-width:620px){.note{font-size:11px}}

/* ============================================================
   ASCEND PICKUP ADD-ON BOARD, THEME LAYER
   ------------------------------------------------------------
   THIS FILE IS THE SWAP POINT. Marketing replaces this one file
   plus the files in tv-board/assets/, and nothing else changes.

   What lives here          : color, type, fills, borders, radii,
                              shadows, the header treatment, the
                              ticker cap shape, background art.
   What does NOT live here  : zone geometry, grid columns, the
                              cqh/cqw sizing, the --s row scale,
                              rotation timing, any data binding.

   Every rule here targets a class the structure already emits.
   Do not rename a class or add a wrapper element. If a design
   needs a structural change, it comes back to Nathan, because
   the data binding is keyed to these names.

   Brand hex below is sampled from Ascend_Cannabis_DISPOutlet_HOR
   (Adobe Illustrator source, D. Barthel 2023-08-07), so it is
   authoritative over anything previously eyeballed from a JPEG.

   All five PA locations are branded "Ascend Dispensary Outlet"
   (Nathan, 2026-09-14), so this one lockup is correct network wide.
   ============================================================ */

:root{
  /* --- brand, from the supplied artwork --------------------- */
  --navy:        #13416C;   /* logo navy, exact */
  --orange:      #F89521;   /* logo orange, exact */

  /* --- derived grounds -------------------------------------- */
  --navy-deep:   #0B2A49;
  --navy-floor:  #071C33;
  --navy-lift:   #1A5187;
  --orange-soft: #FBB865;
  --cyan:        #45B0E2;
  --cyan-soft:   #8FD2F0;

  /* --- identity band ---------------------------------------- */
  --bar:         #FFFFFF;   /* the logo is drawn for a light ground */
  --bar-ink:     #13416C;
  --bar-muted:   #6E86A2;
  --bar-line:    rgba(19,65,108,.16);

  /* --- content surfaces ------------------------------------- */
  --ink:         #EEF5FC;
  --muted:       #93AECB;
  --line:        rgba(255,255,255,.12);
  --panel:       rgba(255,255,255,.045);
  --panel-lift:  rgba(255,255,255,.07);

  /* --- semantic, not brand accents -------------------------- */
  --sativa:      #F5C45A;
  --indica:      #B79BFF;
  --hybrid:      #63D8E8;
  --alert:       #FF7A45;

  /* --- type ------------------------------------------------- */
  --font-display: "Archivo", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-body:    "Archivo", "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  --radius:      1.5cqh;
}

/* ---------------- the board ground ---------------- */
.stage{
  background:
    radial-gradient(120% 90% at 88% -12%, rgba(69,176,226,.20), transparent 55%),
    radial-gradient(130% 120% at -12% 112%, rgba(248,149,33,.16), transparent 52%),
    linear-gradient(158deg, var(--navy) 0%, var(--navy-deep) 58%, var(--navy-floor) 100%);
  color: var(--ink);
  font-family: var(--font-body);
}

/* ---------------- zone 1, identity band ---------------- */
.hdr{ background: var(--bar); border-bottom: .3cqh solid var(--orange); }
.hdr .loc{ color: var(--bar-muted); border-left-color: var(--bar-line); }
.stamp{ background: rgba(19,65,108,.06); border-color: var(--bar-line); }
.stamp .tx{ color: var(--bar-ink); }
.stamp .dot{ background: var(--cyan); box-shadow: 0 0 0 .5cqh rgba(69,176,226,.20); }
.stage[data-state="stale"] .stamp .dot{ background: var(--orange); box-shadow: 0 0 0 .5cqh rgba(248,149,33,.20); }
.stage[data-state="stale"] .stamp .tx{ color: #A8641A; }
.stage[data-state="down"]  .stamp .dot,
.stage[data-state="still"] .stamp .dot{ background: var(--bar-muted); box-shadow: none; }
.stage[data-state="down"]  .stamp .tx,
.stage[data-state="still"] .stamp .tx{ color: var(--bar-muted); }

/* ---------------- zone 2, the rule ---------------- */
.rule{
  border-bottom: .4cqh solid var(--orange);
  background: linear-gradient(90deg, rgba(248,149,33,.18) 0%, rgba(248,149,33,.04) 46%, transparent 72%);
}
.rule .big{ font-family: var(--font-display); color: var(--ink); }
.rule .big em{ color: var(--orange); font-style: normal; }
.rule .sub{ color: var(--muted); border-left: .2cqh solid var(--line); }

/* ---------------- zone labels ---------------- */
.zlab{ border-bottom: .2cqh solid var(--line); }
.zlab .t{ font-family: var(--font-display); color: #fff; }
.zlab .c{ color: var(--muted); }

/* ---------------- the add-on row ---------------- */
.row{
  background: var(--panel);
  border: .18cqh solid var(--line);
  border-left: .7cqh solid var(--cyan);
  border-radius: var(--radius);
}
.row[data-lin="Sativa"]{ border-left-color: var(--sativa); }
.row[data-lin="Indica"]{ border-left-color: var(--indica); }
.row[data-lin="Hybrid"]{ border-left-color: var(--hybrid); }
.row .nm{ font-family: var(--font-display); color: var(--ink); }
.row .meta{ color: var(--muted); }
.row .meta .was{ color: #CFE0F2; }
.row .meta .req{ color: var(--orange-soft); }
.row .now .lab{ color: var(--orange); }
.row .now .amt{ font-family: var(--font-display); color: #fff; }
.row .now .amt s{ color: var(--muted); }

.pill{ border: .16cqh solid currentColor; border-radius: 999px; }
.pill[data-lin="Sativa"]{ color: var(--sativa); }
.pill[data-lin="Indica"]{ color: var(--indica); }
.pill[data-lin="Hybrid"]{ color: var(--hybrid); }

.bdg{ border-radius: 999px; }
.bdg.low{ background: var(--alert); color: #2A0A00; }
.bdg.mid{ color: var(--orange-soft); border: .16cqh solid var(--orange-soft); }

/* ---------------- the rotating card zone ---------------- */
.fcard{
  background: linear-gradient(150deg, rgba(248,149,33,.15) 0%, rgba(255,255,255,.04) 68%);
  border: .18cqh solid rgba(251,184,101,.30);
  border-radius: var(--radius);
}
.fcard::before{ background: var(--orange); color: #2A1500; border-radius: 999px; }
.fcard .nm{ font-family: var(--font-display); color: var(--ink); }
.fcard .meta{ color: var(--muted); }
.fcard .deal{ font-family: var(--font-display); color: #fff; }
.fcard .deal s{ color: var(--orange-soft); }
.dots i{ background: var(--line); }
.dots i.on{ background: var(--orange); }
.empty{ border: .2cqh dashed var(--line); border-radius: var(--radius); color: var(--muted); }
.hair{ background: var(--orange); border-radius: 999px; }

/* ---------------- zone 4, ticker ---------------- */
.tick{ border-top: .2cqh solid var(--line); background: rgba(7,28,51,.6); }
.tick .cap{
  font-family: var(--font-display);
  color: #2A1500; background: var(--orange);
  clip-path: polygon(0 0, 100% 0, calc(100% - 1.5cqh) 100%, 0 100%);
}
.track .seg{ color: var(--ink); }
.track .seg u{ color: var(--cyan-soft); text-decoration: none; }
.track .sep{ background: var(--orange); border-radius: 50%; }
.tick .fix{
  color: var(--muted);
  background: linear-gradient(90deg, transparent, rgba(7,28,51,.94) 12%);
}

</style>


</head>
<body>
<div class="ctl">
  <div class="grp"><b>Store</b><span id="swStore"></span></div>
  <div class="grp"><b>Feed state</b><span id="swState"></span></div>
  <div class="grp"><b>Right column</b><span id="swZone"></span></div>
</div>

<div class="stage" id="stage" data-state="live">
  <div class="hdr">
    <div class="brand">
      <img class="logo" id="logo" alt="Ascend" src="">
      <span class="loc" id="loc"></span>
    </div>
    <div class="stamp"><span class="dot"></span><span class="tx" id="stamp">Live</span></div>
  </div>

  <div class="rule">
    <div class="big" id="ruleBig"></div>
    <div class="sub" id="ruleSub"></div>
  </div>

  <div class="body">
    <div class="menu">
      <div class="zlab"><span class="t">Today's Add-Ons</span><span class="c" id="cnt"></span></div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="fresh">
      <div class="zlab"><span class="t" id="zoneT"></span><span class="dots" id="dots"></span></div>
      <div class="fcards" id="fcards"></div>
      <div class="hair" id="hair"></div>
    </div>
  </div>

  <div class="tick">
    <div class="cap" id="tickCap"></div>
    <div class="win"><div class="track" id="track"></div></div>
    <div class="fix" id="fix"></div>
  </div>
</div>

<div class="note">
  Preview only. Add <code>?kiosk=1</code> to run the board full bleed with these controls hidden.
</div>

<script>
const DATA = {

/* ============================================================
   CONFIG. The only numbers an operator tunes.
   ============================================================ */
const CFG = {
  rotateSeconds:    9,       // card zone dwell
  tickerPxPerSec:   85,      // marquee speed
  scarcityLast:     1,       // units at or below this read LAST ONE
  scarcityLow:      5,       // units at or below this read ONLY n LEFT
  freshMinutes:     20,      // newer than this is LIVE
  staleHours:       12,      // older than this drops to the down state
  stillTickerItems: 3,       // segments on a still frame, which cannot scroll
  cardsPerSet:      3,

  /* Which content sits where. "bundles" puts the everyday bundles in
     the right hand card zone and Just Landed in the ticker. "fresh"
     is the reverse. Flip this one string to swap them back. */
  cardZone: "bundles"
};

const params = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const STORES = Object.keys(DATA.addOns);

if (params.get("kiosk") === "1") document.body.classList.add("kiosk");
/* A still frame renders one frozen image, for export as a signage asset.
   It cannot scroll, cannot time a rotation, and sits on a wall until it
   is replaced, so it never claims to be live. */
const STILL = params.get("still") === "1";
if (STILL) document.body.classList.add("still");
const STILL_BADGES = params.get("badges") === "1";

let store = STORES.find(s => s.toLowerCase() === (params.get("store") || "").toLowerCase())
         || DATA.defaultStore || STORES[0];
let zone  = params.get("zone") || CFG.cardZone;

function deriveState(){
  const raw = String(DATA.asOf || "");
  const t = new Date(raw.includes("T") ? raw : raw + "T12:00:00");
  const age = (Date.now() - t.getTime()) / 60000;
  if (age <= CFG.freshMinutes) return "live";
  if (age <= CFG.staleHours * 60) return "stale";
  return "down";
}
let state = params.get("state")
  || (STILL ? "still" : (params.get("kiosk") === "1" ? deriveState() : "live"));

const money = n => '<s>$</s>' + n;
const DOT = '<span class="d">&middot;</span>';

/* ---------------- the add-on menu ---------------- */
function scarcity(units){
  if (STILL) { if (!STILL_BADGES) return ""; }
  else if (state !== "live") return "";
  if (units <= CFG.scarcityLast) return '<span class="bdg low">Last one</span>';
  if (units <= CFG.scarcityLow)  return '<span class="bdg mid">Only ' + units + ' left</span>';
  return "";
}

function fitRows(){
  const rows = $("#rows");
  let lo = 0.55, hi = 1.0;
  rows.style.setProperty("--s", hi);
  if (rows.scrollHeight <= rows.clientHeight) return;
  for (let i = 0; i < 18; i++){
    const mid = (lo + hi) / 2;
    rows.style.setProperty("--s", mid);
    if (rows.scrollHeight > rows.clientHeight) hi = mid; else lo = mid;
  }
  rows.style.setProperty("--s", lo);
}

function paintMenu(){
  const list = (DATA.addOns[store] || []).slice().sort((a, b) => a.addon - b.addon);
  $("#cnt").textContent = list.length + (list.length === 1 ? " item" : " items");
  $("#rows").innerHTML = list.map(it => {
    const bits = ['<span class="pill" data-lin="' + it.type + '">' + it.type + '</span>'];
    if (it.thc && parseFloat(it.thc) >= 5) bits.push("THC " + it.thc + "%");
    if (it.tp) bits.push(it.tp);
    bits.push('<span class="was">Menu $' + it.menu + '</span>');
    if (it.req) bits.push('<span class="req">' + it.req + '</span>');
    return '<div class="row" data-lin="' + it.type + '">'
      + '<div><div class="nm">' + it.name + '</div><div class="meta">' + bits.join(DOT) + '</div></div>'
      + '<div>' + scarcity(it.units) + '</div>'
      + '<div class="now"><span class="lab">Add-on</span><div class="amt">' + money(it.addon) + '</div></div>'
      + '</div>';
  }).join("");
  fitRows();
}

/* ---------------- the rotating card zone ---------------- */
let sets = [], idx = 0, timer = null;

function cardItems(){
  if (zone === "fresh") return (DATA.justLanded[store] || []).map(it => ({
    flag: "New", nm: it.name,
    meta: [it.type ? '<span class="pill" data-lin="' + it.type + '">' + it.type + '</span>' : "",
           it.thc ? "THC " + it.thc + "%" : "", it.sub || ""].filter(Boolean).join(" ")
  }));
  return (DATA.bundles || []).map(b => {
    const p = b.split("|");
    return { flag: "", nm: p[0].trim(),
             deal: p[1] ? p[1].trim().replace(/^(\d+)\s*\/\s*\$?/, '<s>$1 for</s> $') : "" };
  });
}

function buildSets(){
  const all = cardItems();
  const n = Math.max(1, Math.ceil(all.length / CFG.cardsPerSet));
  sets = Array.from({length: n}, () => []);
  // Stride rather than slice. Consecutive entries are usually rungs of the
  // same ladder, and three near identical cards on screen at once reads as
  // a stuck board from ten feet.
  all.forEach((it, i) => sets[i % n].push(it));
  sets = sets.filter(s => s.length);
  if (!sets.length) sets = [[]];
  idx = 0;
}

function paintSet(){
  $("#zoneT").textContent = zone === "fresh" ? "Just Landed" : "Everyday Bundles";
  const set = sets[idx % sets.length];
  $("#fcards").innerHTML = set.length
    ? set.map(it => '<div class="fcard" data-flag="' + it.flag + '">'
        + '<div class="nm">' + it.nm + '</div>'
        + (it.deal ? '<div class="deal">' + it.deal + '</div>' : "")
        + (it.meta ? '<div class="meta">' + it.meta + '</div>' : "")
        + '</div>').join("")
    : '<div class="empty">' + (zone === "fresh"
        ? "New arrivals land every week.<br>Ask a budtender what came in."
        : "Ask a budtender about this week's bundles.") + '</div>';
  $("#dots").innerHTML = sets.map((_, i) => '<i class="' + (i === idx % sets.length ? "on" : "") + '"></i>').join("");
  fitCards();
}

/* Same contract as the rows: the card scales so nothing is ever cut off.
   Real names run past 60 characters, for example
   "BITS Elderberry Wellness 1:1 CBD:THC Troches 5mg/20pk (100mg)". */
function fitCards(){
  document.querySelectorAll(".fcard").forEach(card => {
    let lo = 0.62, hi = 1.0;
    card.style.setProperty("--cs", hi);
    if (card.scrollHeight <= card.clientHeight) return;
    for (let i = 0; i < 14; i++){
      const mid = (lo + hi) / 2;
      card.style.setProperty("--cs", mid);
      if (card.scrollHeight > card.clientHeight) hi = mid; else lo = mid;
    }
    card.style.setProperty("--cs", lo);
  });
}

function restartHair(){
  const h = $("#hair");
  h.style.animation = "none"; void h.offsetWidth;
  h.style.animation = "fill " + CFG.rotateSeconds + "s linear forwards";
}

function startRotation(){
  clearInterval(timer);
  if (STILL){ idx = parseInt(params.get("set") || "0", 10) || 0; paintSet(); return; }
  paintSet(); restartHair();
  if (sets.length < 2){ $("#hair").style.animation = "none"; return; }
  timer = setInterval(() => {
    const c = $("#fcards");
    c.classList.add("fade");
    setTimeout(() => { idx++; paintSet(); c.classList.remove("fade"); }, 440);
    restartHair();
  }, CFG.rotateSeconds * 1000);
}

/* ---------------- ticker ---------------- */
function tickerSegs(){
  const segs = [];
  if (DATA.loyaltyToday) segs.push(["Today", DATA.loyaltyToday]);
  if (zone === "bundles"){
    (DATA.justLanded[store] || []).forEach(it => segs.push(["Just landed", it.name]));
  } else {
    (DATA.bundles || []).forEach(b => {
      const p = b.split("|");
      segs.push(["Bundle", p[0].trim() + (p[1] ? "  " + p[1].trim() : "")]);
    });
  }
  if (CFG.showAncillary) (DATA.ancillary || []).forEach(a => segs.push(["Ancillary", a]));
  return segs;
}

function paintTicker(){
  const segs = tickerSegs();
  const track = $("#track");
  $("#tickCap").textContent = "Also Today";
  $("#fix").textContent = DATA.compliance;

  const one = s => '<span class="seg">' + (s[0] ? '<u>' + s[0] + '</u>' : "")
    + s[1] + '</span><span class="sep"></span>';
  if (!segs.length){ track.innerHTML = ""; return; }

  if (STILL){
    track.innerHTML = segs.slice(0, CFG.stillTickerItems).map(one).join("");
    track.style.animation = "none";
    return;
  }
  const html = segs.map(one).join("");
  track.innerHTML = html + html;              // two copies for a seamless loop
  requestAnimationFrame(() => {
    const half = track.scrollWidth / 2;
    if (!half) return;
    track.style.setProperty("--shift", (-half) + "px");
    track.style.animation = "roll " + (half / CFG.tickerPxPerSec) + "s linear infinite";
  });
}

/* ---------------- header and rule ---------------- */
function paintChrome(){
  $("#stage").dataset.state = state;
  $("#logo").src = DATA.logos[store] || DATA.logos.default;
  $("#loc").textContent = store.toUpperCase();

  const raw = String(DATA.asOf || "");
  const t = new Date(raw.includes("T") ? raw : raw + "T12:00:00");
  const opts = { timeZone: "America/New_York" };
  if (STILL){
    $("#stamp").textContent = "Updated " +
      t.toLocaleDateString("en-US", Object.assign({ month: "short", day: "numeric" }, opts));
  } else {
    const hhmm = t.toLocaleTimeString("en-US", Object.assign({ hour: "numeric", minute: "2-digit" }, opts));
    $("#stamp").textContent = state === "live" ? "Live  " + hhmm
                            : state === "stale" ? "Updated " + hhmm
                            : "Prices current, stock not";
  }

  $("#ruleBig").innerHTML = "Spend <em>$" + DATA.unlock.spend + "</em>, add up to <em>"
                          + DATA.unlock.count + "</em>.";
  const hedge = (state === "down" || (STILL && !STILL_BADGES));
  $("#ruleSub").innerHTML = "Any " + (DATA.unlock.count === 2 ? "two" : DATA.unlock.count)
    + " items on this list, at the add-on price.<br>"
    + (hedge ? "Ask your budtender what is still in stock." : "Ask your budtender at the counter.");
}

function render(){ paintChrome(); paintMenu(); buildSets(); startRotation(); paintTicker(); }

/* ---------------- preview controls ---------------- */
function buildControls(){
  $("#swStore").innerHTML = STORES.map(s =>
    '<button data-store="' + s + '" aria-pressed="' + (s === store) + '">' + s + '</button>').join("");
  $("#swState").innerHTML = [["live","Live"],["stale","Stale"],["down","Feed down"]].map(s =>
    '<button data-state="' + s[0] + '" aria-pressed="' + (s[0] === state) + '">' + s[1] + '</button>').join("");
  $("#swZone").innerHTML = [["bundles","Bundles"],["fresh","Just Landed"]].map(s =>
    '<button data-zone="' + s[0] + '" aria-pressed="' + (s[0] === zone) + '">' + s[1] + '</button>').join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-store],button[data-state],button[data-zone]");
  if (!b) return;
  if (b.dataset.store) store = b.dataset.store;
  else if (b.dataset.state) state = b.dataset.state;
  else zone = b.dataset.zone;
  buildControls(); render();
});

buildControls();
render();
window.addEventListener("resize", () => { fitRows(); fitCards(); paintTicker(); });
if (document.fonts) document.fonts.ready.then(() => { fitRows(); fitCards(); paintTicker(); });
</script>

</body>
</html>
