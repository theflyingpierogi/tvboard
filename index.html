<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend Pickup Add-On Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   STRUCTURE LAYER. Geometry, sizing and behavior only.
   Every color, fill, border, radius and typeface lives in
   tv-board/theme.css, which build_board.py inlines below.
   Marketing never edits this block.

   THE BOARD IS DRAWN AT EXACTLY 1920 x 1080 CSS PIXELS AND THEN
   SCALED TO FIT BY JS. Every number below is a real pixel on that
   canvas. Do not use vw, vh, %, cqw or cqh for sizing.

   This replaced container query units on 2026-09-14. The Cranberry
   player's browser predates them (Chrome 105, Aug 2022), so every
   cqh/cqw declaration was silently dropped as invalid, fonts fell
   back to 16px and the absolutely positioned zones collapsed onto
   each other. The screen showed a white band and nothing else. A
   fixed canvas plus transform:scale works in every browser back to
   roughly 2012 and is also far easier for a designer to work in.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 16px 22px;background:#050D18}

/* ---------- preview chrome, NOT part of the board ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  width:100%;max-width:1400px;font:600 12px/1.4 system-ui,sans-serif;color:#8FA6C2}
.ctl .grp{display:flex;gap:6px;align-items:center;background:#0B1A2E;border:1px solid #16304F;border-radius:999px;padding:5px 8px}
.ctl b{color:#6B84A3;font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:10px;padding:0 4px}
.ctl button{font:700 12px system-ui,sans-serif;color:#B9CEE6;background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 11px;cursor:pointer}
.ctl button:hover{background:#16304F}
.ctl button[aria-pressed="true"]{background:#F89521;color:#1A0C00}
.note{max-width:1400px;width:100%;font:500 12px/1.6 system-ui,sans-serif;color:#7A93B2;text-align:center}
body.kiosk .ctl,body.kiosk .note{display:none}
body.kiosk{padding:0;gap:0;background:#000}

/* ---------------------- board frame -------------------------- */
/* The fitbox is whatever space we are given. The stage is always
   1920x1080 and is scaled into it by fitStage(). No aspect-ratio,
   no viewport units, no container queries: the three things most
   likely to be missing on a signage player. */
.fitbox{position:relative;width:100%;max-width:1400px;overflow:hidden;background:#000}
body.kiosk .fitbox{position:fixed;left:0;top:0;right:0;bottom:0;width:auto;height:auto;max-width:none}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;
  overflow:hidden;transform-origin:0 0}

/* ZONE 1, identity band */
.hdr{position:absolute;top:0;left:0;right:0;height:118.8px;display:flex;
  align-items:center;justify-content:space-between;padding:0 76.8px}
.brand{display:flex;align-items:center;min-width:0}
.brand .loc{margin-left:26.88px}
.brand .logo{height:66.96px;width:auto;display:block;flex:none}
.brand .loc{font-size:22.68px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  padding-left:24.96px;border-left-style:solid;border-left-width:2.7px;white-space:nowrap}
.stamp{display:flex;align-items:center;padding:10.8px 34.56px;border-radius:999px;
  border-style:solid;border-width:2.16px;flex:none}
.stamp .dot{width:12.96px;height:12.96px;border-radius:50%;flex:none;margin-right:17.28px}
.stamp .tx{font-size:20.52px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.stage[data-state="live"] .stamp .dot{animation:pulse 2.4s ease-in-out infinite}

/* ZONE 2, the rule */
.rule{position:absolute;top:118.8px;left:0;right:0;height:129.6px;
  display:flex;align-items:center;padding:0 76.8px}
.rule .sub{margin-left:46.08px}
.rule .big{font-size:62.64px;font-weight:900;line-height:1;letter-spacing:-.015em;white-space:nowrap}
.rule .sub{font-size:25.38px;font-weight:600;line-height:1.25;padding-left:42.24px}

/* ZONE 3, body split */
.body{position:absolute;top:248.4px;left:0;right:0;bottom:113.4px;
  display:grid;grid-template-columns:61% 39%;gap:42.24px;padding:23.76px 76.8px 17.28px}
.zlab{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:11.88px;margin-bottom:14.04px}
.zlab .t{font-size:27px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.zlab .c{font-size:19.98px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}

/* 3a, the add-on menu. Fixed, never rotates. */
.menu{display:flex;flex-direction:column;min-height:0}
/* The row is ONE component that scales continuously so the whole
   list always fits, whether a store has three add-ons or eight.
   --s is set by JS. Design the row, never its height. */
.rows{--s:1;display:flex;flex-direction:column;justify-content:center;
  flex:1;min-height:0;overflow:hidden}
.row + .row{margin-top:calc(9.18px * var(--s))}
.row{flex:0 0 auto;display:grid;grid-template-columns:1fr auto auto;align-items:center;
  gap:26.88px;padding:calc(12.42px * var(--s)) calc(34.56px * var(--s))}
.row .nm{font-weight:700;line-height:1.08;font-size:calc(42.12px * var(--s));
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .meta{display:flex;align-items:center;flex-wrap:wrap;
  margin-top:calc(5.4px * var(--s));font-weight:600;font-size:calc(23.22px * var(--s))}
.row .meta > *{margin-right:calc(16.32px * var(--s))}
.row .meta .was,.row .meta .req{font-weight:800}
.row .meta .d{opacity:.4}
.pill{display:inline-block;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:3.02px 14.4px;line-height:1.15;font-size:calc(18.58px * var(--s))}
.row .now{text-align:right;line-height:1;min-width:calc(249.6px * var(--s))}
.row .now .lab{display:block;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  font-size:calc(18.58px * var(--s));margin-bottom:calc(3.78px * var(--s))}
.row .now .amt{font-weight:900;line-height:.92;white-space:nowrap;font-size:calc(64.8px * var(--s))}
.row .now .amt s{font-weight:800;text-decoration:none;vertical-align:.45em;font-size:calc(30.24px * var(--s))}
.bdg{display:inline-block;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:calc(5.94px * var(--s)) calc(19.2px * var(--s));white-space:nowrap;
  font-size:calc(19.98px * var(--s));line-height:1.1}

/* 3b, the rotating card zone */
.fresh{position:relative;display:flex;flex-direction:column;min-height:0}
.fcards{display:grid;grid-template-rows:repeat(3,1fr);gap:16.2px;flex:1;min-height:0}
.fcard{--cs:1;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:17.28px 34.56px;min-height:0;overflow:hidden;
  transition:opacity .45s ease, transform .45s ease}
.fcard[data-flag=""]::before{display:none}
.fcard .nm{padding-right:0}
.fcard[data-flag]:not([data-flag=""]) .nm{padding-right:105.6px}
.fcard::before{content:attr(data-flag);position:absolute;top:12.96px;right:26.88px;
  font-size:15.66px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;padding:3.78px 17.28px}
.fcard .nm{font-size:calc(33.48px * var(--cs));font-weight:700;line-height:1.1;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.fcard .meta{display:flex;align-items:center;flex-wrap:wrap;
  margin-top:calc(9.72px * var(--cs));font-size:calc(21.06px * var(--cs));font-weight:600}
.fcard .meta > *{margin:0 17.28px 3.24px 0}
.fcard .pill{font-size:calc(16.2px * var(--cs))}
.fcard .deal{margin-top:calc(10.8px * var(--cs));font-size:calc(38.88px * var(--cs));font-weight:900;line-height:1}
.fcard .deal s{font-size:calc(23.76px * var(--cs));font-weight:800;text-decoration:none;letter-spacing:.06em;
  text-transform:uppercase;margin-right:11.52px;vertical-align:.35em}
.fcards.fade .fcard{opacity:0;transform:translateY(11.88px)}
.dots{display:flex;align-items:center}
.dots i{width:11.88px;height:11.88px;border-radius:50%;display:block;margin-left:11.52px}
.dots i:first-child{margin-left:0}
.empty{display:flex;align-items:center;justify-content:center;height:100%;grid-row:1 / span 3;
  font-size:23.76px;font-weight:600;text-align:center;padding:0 38.4px}
.hair{position:absolute;left:0;bottom:-17.28px;height:4.32px;width:0;opacity:.8}
@keyframes fill{from{width:0}to{width:100%}}

/* ZONE 4, ticker */
.tick{position:absolute;left:0;right:0;bottom:0;height:113.4px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:stretch}
.tick .cap{display:flex;align-items:center;padding:0 30.72px 0 76.8px;
  font-size:22.68px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.tick .win{position:relative;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 48px);
  mask-image:linear-gradient(90deg,transparent 0,#000 48px)}
.track{display:flex;align-items:center;flex:none;will-change:transform}
.track .seg{display:flex;align-items:center;padding:0 30.72px;
  font-size:26.46px;font-weight:700;white-space:nowrap}
.track .seg u{font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:19.98px;margin-right:23.04px}
.track .sep{width:8.1px;height:8.1px;flex:none}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(var(--shift))}}
.tick .fix{display:flex;align-items:center;max-width:460.8px;padding:0 76.8px 0 34.56px;
  font-size:17.28px;font-weight:600;line-height:1.3}

/* still frame: a frozen image cannot scroll or time a rotation */
body.still .hair{display:none}
body.still .tick .win{-webkit-mask-image:none;mask-image:none}
body.still .track{justify-content:space-around;width:100%}
@media (max-width:620px){.note{font-size:11px}}

/* ============================================================
   ASCEND PICKUP ADD-ON BOARD, THEME LAYER
   ------------------------------------------------------------
   THIS FILE IS THE SWAP POINT. Marketing replaces this one file
   plus the files in tv-board/assets/, and nothing else changes.

   What lives here          : color, type, fills, borders, radii,
                              shadows, the header treatment, the
                              ticker cap shape, background art.
   What does NOT live here  : zone geometry, grid columns, the
                              pixel sizing, the --s row scale,
                              rotation timing, any data binding.

   THE CANVAS IS 1920 x 1080 CSS PIXELS. Every length in this file
   is a real pixel on that canvas, and JS scales the whole board to
   whatever the screen is. So a 40px headline here is 40px on a
   1080p screen, half that on a scaled down preview, and you can
   measure straight off an Illustrator artboard set to 1920x1080.

   Do not use cqh, cqw, vw, vh or percentages for sizing. Container
   query units were used here until 2026-09-14 and the Cranberry
   player's browser turned out to be too old to understand them,
   which blanked the board while every self check reported healthy.

   Every rule here targets a class the structure already emits.
   Do not rename a class or add a wrapper element. If a design
   needs a structural change, it comes back to Nathan, because
   the data binding is keyed to these names.

   Brand hex below is sampled from Ascend_Cannabis_DISPOutlet_HOR
   (Adobe Illustrator source, D. Barthel 2023-08-07), so it is
   authoritative over anything previously eyeballed from a JPEG.

   All five PA locations are branded "Ascend Dispensary Outlet"
   (Nathan, 2026-09-14), so this one lockup is correct network wide.
   ============================================================ */

:root{
  /* --- brand, from the supplied artwork --------------------- */
  --navy:        #13416C;   /* logo navy, exact */
  --orange:      #F89521;   /* logo orange, exact */

  /* --- derived grounds -------------------------------------- */
  --navy-deep:   #0B2A49;
  --navy-floor:  #071C33;
  --navy-lift:   #1A5187;
  --orange-soft: #FBB865;
  --cyan:        #45B0E2;
  --cyan-soft:   #8FD2F0;

  /* --- identity band ---------------------------------------- */
  --bar:         #FFFFFF;   /* the logo is drawn for a light ground */
  --bar-ink:     #13416C;
  --bar-muted:   #6E86A2;
  --bar-line:    rgba(19,65,108,.16);

  /* --- content surfaces ------------------------------------- */
  --ink:         #EEF5FC;
  --muted:       #93AECB;
  --line:        rgba(255,255,255,.12);
  --panel:       rgba(255,255,255,.045);
  --panel-lift:  rgba(255,255,255,.07);

  /* --- semantic, not brand accents -------------------------- */
  --sativa:      #F5C45A;
  --indica:      #B79BFF;
  --hybrid:      #63D8E8;
  --alert:       #FF7A45;

  /* --- type ------------------------------------------------- */
  --font-display: "Archivo", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-body:    "Archivo", "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  --radius:      16.2px;
}

/* ---------------- the board ground ---------------- */
.stage{
  background:
    radial-gradient(120% 90% at 88% -12%, rgba(69,176,226,.20), transparent 55%),
    radial-gradient(130% 120% at -12% 112%, rgba(248,149,33,.16), transparent 52%),
    linear-gradient(158deg, var(--navy) 0%, var(--navy-deep) 58%, var(--navy-floor) 100%);
  color: var(--ink);
  font-family: var(--font-body);
}

/* ---------------- zone 1, identity band ---------------- */
.hdr{ background: var(--bar); border-bottom: 3.24px solid var(--orange); }
.hdr .loc{ color: var(--bar-muted); border-left-color: var(--bar-line); }
.stamp{ background: rgba(19,65,108,.06); border-color: var(--bar-line); }
.stamp .tx{ color: var(--bar-ink); }
.stamp .dot{ background: var(--cyan); box-shadow: 0 0 0 5.4px rgba(69,176,226,.20); }
.stage[data-state="stale"] .stamp .dot{ background: var(--orange); box-shadow: 0 0 0 5.4px rgba(248,149,33,.20); }
.stage[data-state="stale"] .stamp .tx{ color: #A8641A; }
.stage[data-state="down"]  .stamp .dot,
.stage[data-state="still"] .stamp .dot{ background: var(--bar-muted); box-shadow: none; }
.stage[data-state="down"]  .stamp .tx,
.stage[data-state="still"] .stamp .tx{ color: var(--bar-muted); }

/* ---------------- zone 2, the rule ---------------- */
.rule{
  border-bottom: 4.32px solid var(--orange);
  background: linear-gradient(90deg, rgba(248,149,33,.18) 0%, rgba(248,149,33,.04) 46%, transparent 72%);
}
.rule .big{ font-family: var(--font-display); color: var(--ink); }
.rule .big em{ color: var(--orange); font-style: normal; }
.rule .sub{ color: var(--muted); border-left: 2.16px solid var(--line); }

/* ---------------- zone labels ---------------- */
.zlab{ border-bottom: 2.16px solid var(--line); }
.zlab .t{ font-family: var(--font-display); color: #fff; }
.zlab .c{ color: var(--muted); }

/* ---------------- the add-on row ---------------- */
.row{
  background: var(--panel);
  border: 1.94px solid var(--line);
  border-left: 7.56px solid var(--cyan);
  border-radius: var(--radius);
}
.row[data-lin="Sativa"]{ border-left-color: var(--sativa); }
.row[data-lin="Indica"]{ border-left-color: var(--indica); }
.row[data-lin="Hybrid"]{ border-left-color: var(--hybrid); }
.row .nm{ font-family: var(--font-display); color: var(--ink); }
.row .meta{ color: var(--muted); }
.row .meta .was{ color: #CFE0F2; }
.row .meta .req{ color: var(--orange-soft); }
.row .now .lab{ color: var(--orange); }
.row .now .amt{ font-family: var(--font-display); color: #fff; }
.row .now .amt s{ color: var(--muted); }

.pill{ border: 1.73px solid currentColor; border-radius: 999px; }
.pill[data-lin="Sativa"]{ color: var(--sativa); }
.pill[data-lin="Indica"]{ color: var(--indica); }
.pill[data-lin="Hybrid"]{ color: var(--hybrid); }

.bdg{ border-radius: 999px; }
.bdg.low{ background: var(--alert); color: #2A0A00; }
.bdg.mid{ color: var(--orange-soft); border: 1.73px solid var(--orange-soft); }

/* ---------------- the rotating card zone ---------------- */
.fcard{
  background: linear-gradient(150deg, rgba(248,149,33,.15) 0%, rgba(255,255,255,.04) 68%);
  border: 1.94px solid rgba(251,184,101,.30);
  border-radius: var(--radius);
}
.fcard::before{ background: var(--orange); color: #2A1500; border-radius: 999px; }
.fcard .nm{ font-family: var(--font-display); color: var(--ink); }
.fcard .meta{ color: var(--muted); }
.fcard .deal{ font-family: var(--font-display); color: #fff; }
.fcard .deal s{ color: var(--orange-soft); }
.dots i{ background: var(--line); }
.dots i.on{ background: var(--orange); }
.empty{ border: 2.16px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
.hair{ background: var(--orange); border-radius: 999px; }

/* ---------------- zone 4, ticker ---------------- */
.tick{ border-top: 2.16px solid var(--line); background: rgba(7,28,51,.6); }
.tick .cap{
  font-family: var(--font-display);
  color: #2A1500; background: var(--orange);
  clip-path: polygon(0 0, 100% 0, calc(100% - 16.2px) 100%, 0 100%);
}
.track .seg{ color: var(--ink); }
.track .seg u{ color: var(--cyan-soft); text-decoration: none; }
.track .sep{ background: var(--orange); border-radius: 50%; }
.tick .fix{
  color: var(--muted);
  background: linear-gradient(90deg, transparent, rgba(7,28,51,.94) 12%);
}

</style>


</head>
<body>
<div class="ctl">
  <div class="grp"><b>Store</b><span id="swStore"></span></div>
  <div class="grp"><b>Feed state</b><span id="swState"></span></div>
  <div class="grp"><b>Right column</b><span id="swZone"></span></div>
</div>

<div class="fitbox" id="fitbox">
<div class="stage" id="stage" data-state="live">
  <div class="hdr">
    <div class="brand">
      <img class="logo" id="logo" alt="Ascend" src="">
      <span class="loc" id="loc"></span>
    </div>
    <div class="stamp"><span class="dot"></span><span class="tx" id="stamp">Live</span></div>
  </div>

  <div class="rule">
    <div class="big" id="ruleBig"></div>
    <div class="sub" id="ruleSub"></div>
  </div>

  <div class="body">
    <div class="menu">
      <div class="zlab"><span class="t">Today's Add-Ons</span><span class="c" id="cnt"></span></div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="fresh">
      <div class="zlab"><span class="t" id="zoneT"></span><span class="dots" id="dots"></span></div>
      <div class="fcards" id="fcards"></div>
      <div class="hair" id="hair"></div>
    </div>
  </div>

  <div class="tick">
    <div class="cap" id="tickCap"></div>
    <div class="win"><div class="track" id="track"></div></div>
    <div class="fix" id="fix"></div>
  </div>
</div>
</div>

<div class="note">
  Preview only. Add <code>?kiosk=1</code> to run the board full bleed with these controls hidden.
</div>

<script>
const DATA = {

/* ============================================================
   CONFIG. The only numbers an operator tunes.
   ============================================================ */
const CFG = {
  rotateSeconds:    9,       // card zone dwell
  tickerPxPerSec:   85,      // marquee speed
  scarcityLast:     1,       // units at or below this read LAST ONE
  scarcityLow:      5,       // units at or below this read ONLY n LEFT
  freshMinutes:     20,      // newer than this is LIVE
  staleHours:       12,      // older than this drops to the down state
  stillTickerItems: 3,       // segments on a still frame, which cannot scroll
  cardsPerSet:      3,

  /* Which content sits where. "bundles" puts the everyday bundles in
     the right hand card zone and Just Landed in the ticker. "fresh"
     is the reverse. Flip this one string to swap them back. */
  cardZone: "bundles"
};

/* ============================================================
   THE FIT. The board is laid out at a fixed 1920x1080 and scaled
   into whatever the player gives us. This is deliberately the
   dumbest possible mechanism: no container queries, no
   aspect-ratio, no viewport units, because a signage player's
   browser is frequently years behind a desktop one and drops
   anything it does not recognise WITHOUT ERROR. That is how the
   board came up as a white band over an empty blue field on
   2026-09-14 while reporting every stage healthy.
   ============================================================ */
const BUILD = "2026-09-14 px-canvas";
function fitStage(){
  const box = document.getElementById("fitbox");
  const st  = document.getElementById("stage");
  if (!box || !st) return;
  let w = box.clientWidth  || window.innerWidth  || 1920;
  let h = box.clientHeight;
  if (!h){ h = Math.round(w * 9 / 16); box.style.height = h + "px"; }
  let k = Math.min(w / 1920, h / 1080);
  if (!isFinite(k) || k <= 0) k = 1;
  st.style.transform = "scale(" + k + ")";
  st.style.left = Math.round((w - 1920 * k) / 2) + "px";
  st.style.top  = Math.round((h - 1080 * k) / 2) + "px";
}

const params = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const STORES = Object.keys(DATA.addOns);

if (params.get("kiosk") === "1") document.body.classList.add("kiosk");
/* A still frame renders one frozen image, for export as a signage asset.
   It cannot scroll, cannot time a rotation, and sits on a wall until it
   is replaced, so it never claims to be live. */
const STILL = params.get("still") === "1";
if (STILL) document.body.classList.add("still");
const STILL_BADGES = params.get("badges") === "1";

let store = STORES.find(s => s.toLowerCase() === (params.get("store") || "").toLowerCase())
         || DATA.defaultStore || STORES[0];
let zone  = params.get("zone") || CFG.cardZone;

function deriveState(){
  const raw = String(DATA.asOf || "");
  const t = new Date(raw.includes("T") ? raw : raw + "T12:00:00");
  const age = (Date.now() - t.getTime()) / 60000;
  if (age <= CFG.freshMinutes) return "live";
  if (age <= CFG.staleHours * 60) return "stale";
  return "down";
}
let state = params.get("state")
  || (STILL ? "still" : (params.get("kiosk") === "1" ? deriveState() : "live"));

/* Signage players commonly ship Chromium with "small ICU", which knows only
   UTC. Passing a named zone like America/New_York throws RangeError there and
   kills the whole render. It works fine in desktop Chrome, which is exactly how
   this got past a preview. Try the correct zone, fall back to device local. */
function fmtTime(d){
  const o = { hour: "numeric", minute: "2-digit" };
  try { return d.toLocaleTimeString("en-US", Object.assign({ timeZone: "America/New_York" }, o)); }
  catch (e) { try { return d.toLocaleTimeString("en-US", o); } catch (e2) {
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); } }
}
function fmtDate(d){
  const o = { month: "short", day: "numeric" };
  try { return d.toLocaleDateString("en-US", Object.assign({ timeZone: "America/New_York" }, o)); }
  catch (e) { try { return d.toLocaleDateString("en-US", o); } catch (e2) {
    return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]
           + " " + d.getDate(); } }
}

const money = n => '<s>$</s>' + n;
const DOT = '<span class="d">&middot;</span>';

/* ---------------- the add-on menu ---------------- */
function scarcity(units){
  if (STILL) { if (!STILL_BADGES) return ""; }
  else if (state !== "live") return "";
  if (units <= CFG.scarcityLast) return '<span class="bdg low">Last one</span>';
  if (units <= CFG.scarcityLow)  return '<span class="bdg mid">Only ' + units + ' left</span>';
  return "";
}

function fitRows(){
  const rows = $("#rows");
  let lo = 0.55, hi = 1.0;
  rows.style.setProperty("--s", hi);
  if (rows.scrollHeight <= rows.clientHeight) return;
  for (let i = 0; i < 18; i++){
    const mid = (lo + hi) / 2;
    rows.style.setProperty("--s", mid);
    if (rows.scrollHeight > rows.clientHeight) hi = mid; else lo = mid;
  }
  rows.style.setProperty("--s", lo);
}

function paintMenu(){
  const list = (DATA.addOns[store] || []).slice().sort((a, b) => a.addon - b.addon);
  $("#cnt").textContent = list.length + (list.length === 1 ? " item" : " items");
  $("#rows").innerHTML = list.map(it => {
    const bits = ['<span class="pill" data-lin="' + it.type + '">' + it.type + '</span>'];
    if (it.thc && parseFloat(it.thc) >= 5) bits.push("<span>THC " + it.thc + "%</span>");
    if (it.tp) bits.push("<span>" + it.tp + "</span>");
    bits.push('<span class="was">Menu $' + it.menu + '</span>');
    if (it.req) bits.push('<span class="req">' + it.req + '</span>');
    return '<div class="row" data-lin="' + it.type + '">'
      + '<div><div class="nm">' + it.name + '</div><div class="meta">' + bits.join(DOT) + '</div></div>'
      + '<div>' + scarcity(it.units) + '</div>'
      + '<div class="now"><span class="lab">Add-on</span><div class="amt">' + money(it.addon) + '</div></div>'
      + '</div>';
  }).join("");
  fitRows();
}

/* ---------------- the rotating card zone ---------------- */
let sets = [], idx = 0, timer = null;

function cardItems(){
  if (zone === "fresh") return (DATA.justLanded[store] || []).map(it => ({
    flag: it.party || "New", nm: it.name,
    meta: [it.type ? '<span class="pill" data-lin="' + it.type + '">' + it.type + '</span>' : "",
           it.thc ? "<span>THC " + it.thc + "%</span>" : "",
           it.sub ? "<span>" + it.sub + "</span>" : ""].filter(Boolean).join("")
  }));
  return (DATA.bundles || []).map(b => {
    const p = b.split("|");
    return { flag: "", nm: p[0].trim(),
             deal: p[1] ? p[1].trim().replace(/^(\d+)\s*\/\s*\$?/, '<s>$1 for</s> $') : "" };
  });
}

function buildSets(){
  const all = cardItems();
  const n = Math.max(1, Math.ceil(all.length / CFG.cardsPerSet));
  sets = Array.from({length: n}, () => []);
  // Stride rather than slice. Consecutive entries are usually rungs of the
  // same ladder, and three near identical cards on screen at once reads as
  // a stuck board from ten feet.
  all.forEach((it, i) => sets[i % n].push(it));
  sets = sets.filter(s => s.length);
  if (!sets.length) sets = [[]];
  idx = 0;
}

function paintSet(){
  $("#zoneT").textContent = zone === "fresh" ? "Just Landed" : "Everyday Bundles";
  const set = sets[idx % sets.length];
  $("#fcards").innerHTML = set.length
    ? set.map(it => '<div class="fcard" data-flag="' + it.flag + '">'
        + '<div class="nm">' + it.nm + '</div>'
        + (it.deal ? '<div class="deal">' + it.deal + '</div>' : "")
        + (it.meta ? '<div class="meta">' + it.meta + '</div>' : "")
        + '</div>').join("")
    : '<div class="empty">' + (zone === "fresh"
        ? "New arrivals land every week.<br>Ask a budtender what came in."
        : "Ask a budtender about this week's bundles.") + '</div>';
  $("#dots").innerHTML = sets.map((_, i) => '<i class="' + (i === idx % sets.length ? "on" : "") + '"></i>').join("");
  fitCards();
}

/* Same contract as the rows: the card scales so nothing is ever cut off.
   Real names run past 60 characters, for example
   "BITS Elderberry Wellness 1:1 CBD:THC Troches 5mg/20pk (100mg)". */
function fitCards(){
  document.querySelectorAll(".fcard").forEach(card => {
    let lo = 0.62, hi = 1.0;
    card.style.setProperty("--cs", hi);
    if (card.scrollHeight <= card.clientHeight) return;
    for (let i = 0; i < 14; i++){
      const mid = (lo + hi) / 2;
      card.style.setProperty("--cs", mid);
      if (card.scrollHeight > card.clientHeight) hi = mid; else lo = mid;
    }
    card.style.setProperty("--cs", lo);
  });
}

function restartHair(){
  const h = $("#hair");
  h.style.animation = "none"; void h.offsetWidth;
  h.style.animation = "fill " + CFG.rotateSeconds + "s linear forwards";
}

function startRotation(){
  clearInterval(timer);
  if (STILL){ idx = parseInt(params.get("set") || "0", 10) || 0; paintSet(); return; }
  paintSet(); restartHair();
  if (sets.length < 2){ $("#hair").style.animation = "none"; return; }
  timer = setInterval(() => {
    const c = $("#fcards");
    c.classList.add("fade");
    setTimeout(() => { idx++; paintSet(); c.classList.remove("fade"); }, 440);
    restartHair();
  }, CFG.rotateSeconds * 1000);
}

/* ---------------- ticker ---------------- */
function tickerSegs(){
  const segs = [];
  if (DATA.loyaltyToday) segs.push(["Today", DATA.loyaltyToday]);
  if (zone === "bundles"){
    (DATA.justLanded[store] || []).forEach(it => segs.push([it.label || "Just landed", it.name]));
  } else {
    (DATA.bundles || []).forEach(b => {
      const p = b.split("|");
      segs.push(["Bundle", p[0].trim() + (p[1] ? "  " + p[1].trim() : "")]);
    });
  }
  if (CFG.showAncillary) (DATA.ancillary || []).forEach(a => segs.push(["Ancillary", a]));
  return segs;
}

function paintTicker(){
  const segs = tickerSegs();
  const track = $("#track");
  $("#tickCap").textContent = "Also Today";
  $("#fix").textContent = DATA.compliance;

  const one = s => '<span class="seg">' + (s[0] ? '<u>' + s[0] + '</u>' : "")
    + s[1] + '</span><span class="sep"></span>';
  if (!segs.length){ track.innerHTML = ""; return; }

  if (STILL){
    track.innerHTML = segs.slice(0, CFG.stillTickerItems).map(one).join("");
    track.style.animation = "none";
    return;
  }
  const html = segs.map(one).join("");
  track.innerHTML = html + html;              // two copies for a seamless loop
  requestAnimationFrame(() => {
    const half = track.scrollWidth / 2;
    if (!half) return;
    track.style.setProperty("--shift", (-half) + "px");
    track.style.animation = "roll " + (half / CFG.tickerPxPerSec) + "s linear infinite";
  });
}

/* ---------------- header and rule ---------------- */
function paintChrome(){
  $("#stage").dataset.state = state;
  $("#logo").src = DATA.logos[store] || DATA.logos.default;
  $("#loc").textContent = store.toUpperCase();

  const raw = String(DATA.asOf || "");
  const t = new Date(raw.includes("T") ? raw : raw + "T12:00:00");
  if (STILL){
    $("#stamp").textContent = "Updated " + fmtDate(t);
  } else {
    const hhmm = fmtTime(t);
    $("#stamp").textContent = state === "live" ? "Live  " + hhmm
                            : state === "stale" ? "Updated " + hhmm
                            : "Prices current, stock not";
  }

  $("#ruleBig").innerHTML = "Spend <em>$" + DATA.unlock.spend + "</em>, add up to <em>"
                          + DATA.unlock.count + "</em>.";
  const hedge = (state === "down" || (STILL && !STILL_BADGES));
  $("#ruleSub").innerHTML = "Any " + (DATA.unlock.count === 2 ? "two" : DATA.unlock.count)
    + " items on this list, at the add-on price.<br>"
    + (hedge ? "Ask your budtender what is still in stock." : "Ask your budtender at the counter.");
}

/* A signage board must degrade, never go blank. Each stage is isolated so a
   failure in one still leaves the rest of the screen useful, and ?debug=1
   surfaces what broke, which matters when the only way to see this screen is
   a security camera. */
const DEBUG = params.get("debug") === "1" || params.get("debug") === "2";
/* debug=2 paints the report full screen in huge type, because the only
   way anyone can see the Cranberry board is a security camera thirty
   feet away and the small overlay is not readable at that distance. */
const DEBUG_BIG = params.get("debug") === "2";

function sup(prop, val){
  try { return (window.CSS && CSS.supports && CSS.supports(prop, val)) ? "y" : "n"; }
  catch (e){ return "?"; }
}
/* CSS.supports("gap","1px") answers yes on browsers that only have GRID
   gap, so flex gap has to be measured rather than asked about. */
function flexGapOK(){
  try {
    const d = document.createElement("div");
    d.style.cssText = "position:absolute;visibility:hidden;display:flex;gap:40px";
    d.appendChild(document.createElement("i"));
    d.appendChild(document.createElement("i"));
    document.body.appendChild(d);
    const ok = d.scrollWidth >= 40;
    d.parentNode.removeChild(d);
    return ok ? "y" : "n";
  } catch (e){ return "?"; }
}
function chromeVer(){
  const m = /Chrom(?:e|ium)\/(\d+)/.exec(navigator.userAgent);
  return m ? m[1] : "?";
}
const TRACE = [];
function safe(label, fn){
  try { fn(); TRACE.push("ok   " + label); }
  catch (err) {
    TRACE.push("FAIL " + label + ": " + (err && err.message ? err.message : err));
    if (window.console) console.error("board stage failed: " + label, err);
  }
}

function paintDebug(){
  let box = document.getElementById("dbg");
  if (!DEBUG){ if (box && box.parentNode) box.parentNode.removeChild(box); return; }
  if (!box){
    box = document.createElement("div");
    box.id = "dbg";
    document.getElementById("stage").appendChild(box);
  }
  box.style.cssText = DEBUG_BIG
    ? "position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:99;"
      + "background:#FFFFFF;color:#000000;font:700 44px/1.38 monospace;"
      + "padding:56px 48px;white-space:pre-wrap;overflow:hidden"
    : "position:absolute;left:38px;top:22px;z-index:99;max-width:1180px;"
      + "background:rgba(0,0,0,.86);color:#FFFFFF;font:700 26px/1.5 monospace;"
      + "padding:20px 26px;border-radius:14px;white-space:pre-wrap";

  const lines = [
    "BUILD " + BUILD,
    "chrome=" + chromeVer() + "  cqh=" + sup("width", "1cqh")
      + "  ar=" + sup("aspect-ratio", "16/9") + "  flexgap=" + flexGapOK(),
    "store=" + store + "  state=" + state + "  zone=" + zone,
    "rows=" + document.querySelectorAll(".row").length
      + "  cards=" + document.querySelectorAll(".fcard").length
      + "  ticker=" + document.querySelectorAll(".track .seg").length
  ].concat(TRACE);
  box.textContent = lines.join("\n");
}

function render(){
  TRACE.length = 0;
  safe("fit", fitStage);
  safe("chrome", paintChrome);
  safe("menu", paintMenu);
  safe("cards", function(){ buildSets(); startRotation(); });
  safe("ticker", paintTicker);
  paintDebug();
}

/* ---------------- preview controls ---------------- */
function buildControls(){
  $("#swStore").innerHTML = STORES.map(s =>
    '<button data-store="' + s + '" aria-pressed="' + (s === store) + '">' + s + '</button>').join("");
  $("#swState").innerHTML = [["live","Live"],["stale","Stale"],["down","Feed down"]].map(s =>
    '<button data-state="' + s[0] + '" aria-pressed="' + (s[0] === state) + '">' + s[1] + '</button>').join("");
  $("#swZone").innerHTML = [["bundles","Bundles"],["fresh","Just Landed"]].map(s =>
    '<button data-zone="' + s[0] + '" aria-pressed="' + (s[0] === zone) + '">' + s[1] + '</button>').join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-store],button[data-state],button[data-zone]");
  if (!b) return;
  if (b.dataset.store) store = b.dataset.store;
  else if (b.dataset.state) state = b.dataset.state;
  else zone = b.dataset.zone;
  buildControls(); render();
});

buildControls();
render();
window.addEventListener("resize", () => { fitStage(); fitRows(); fitCards(); paintTicker(); });
if (document.fonts) document.fonts.ready.then(() => { fitRows(); fitCards(); paintTicker(); });
/* Players sometimes report a 0x0 viewport for a moment after load. One late
   re-fit costs nothing and saves a board scaled to nothing. */
setTimeout(fitStage, 400);
setTimeout(fitStage, 2500);
</script>
